<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boid Flocking Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls-container">
        <div>
            <label for="numBoidsSlider">Number of Boids: <span id="numBoidsValue">100</span></label>
            <input type="range" id="numBoidsSlider" min="10" max="500" value="100" step="10">
        </div>
        <div>
            <label for="maxSpeedSlider">Max Speed: <span id="maxSpeedValue">3.5</span></label>
            <input type="range" id="maxSpeedSlider" min="0.5" max="10" value="3.5" step="0.1">
        </div>
        <div>
            <label for="cursorForceSlider">Cursor Force: <span id="cursorForceValue">1.2</span></label>
            <input type="range" id="cursorForceSlider" min="0.1" max="3.0" value="1.2" step="0.1">
        </div>
    </div>
    <canvas id="briansBrainCanvas"></canvas>
    <script src="script.js"></script> 
</body>
</html>
